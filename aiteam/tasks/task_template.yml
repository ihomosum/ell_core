# Шаблон задачи. Правила заполнения — в /opt/sourcecode/aiteam/Methodology/TaskSchema.md
# ИМЯ ФАЙЛА: task_{NNNN}_<краткий_идентификатор>.yml, где {NNNN} — сквозной номер
# задачи проекта: четыре цифры с ведущими нулями, наибольший занятый в этой папке
# + 1 (или 0001, если нумерованных задач ещё нет). Номер выдаёт ПОСТАНОВЩИК при
# создании, и он больше не меняется (TaskSchema.md, п. 1.1).
task:
  role_source: ./aiteam/Team.yml #источник информации о команде
  role: {Role_name} #роль из файла Team.yml
  description: "{Конкретная задача}"
  docs: "/opt/sourcecode/ipb10_docs/Doc/Arch/ipbStyleV10.md, /opt/sourcecode/ipb10_docs/Doc/Arch/MultitenancyV10.md" #Список специфических документов (за пределами папки docs), которыми должен оперировать агент для реализации этой задачи
  interaction_mode: #interactive | autonomous — канал выноса развилки (п. 4.15 AI_M_MSF). Пусто = умолчание interactive. ДЛЯ handoff-ЗАДАЧИ ОБЯЗАТЕЛЬНО autonomous (п. 8.2 AI_M_MSF): пустым не оставлять
  report: #Имя файла отчета (в папке reports), которые создает агент после выполнения задачи
  task_parent: #Имя файла/идентификатор на задачу, на основе которой создана данная задача
  list_child_task: #Список файлов/идентификаторов задач, которая породила данная задача
  blocked_by: #ЗАПОЛНЯЕТ ИСПОЛНИТЕЛЬ при остановке на развилке: id находки Открытого вопроса (п. 7.2 AI_M_MSF). При создании — ПУСТО